name: 매일 비즈 브리핑

on:
  schedule:
    - cron: "30 22 * * *"       # ① UTC 22:30 = KST 07:30
  workflow_dispatch:             # ② 손으로도 돌릴 수 있게
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

permissions:
  contents: write                # 실행 기록(store/metrics.jsonl)을 레포에 커밋하려고

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # ③ 멈춰 있는 실행을 20분에서 끊는다

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성·발행
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:                     # ④ 비밀값은 여기로만 들어간다
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
          DRY_RUN: "0"           # ⑤ 이 줄이 없으면 Actions에서는 한 번도 안 보낸다

      - name: 실행 기록 저장 (store/metrics.jsonl)
        if: always()             # 발행이 실패해도 그때까지 남은 기록은 저장한다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/metrics.jsonl
          git diff --cached --quiet || git commit -m "metrics: $(date +%F) 실행 기록"
          git push
