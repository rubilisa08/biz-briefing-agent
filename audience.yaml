# 비즈 브리핑 — 타깃 독자 · 중요도 기준 · 제외 조건 · 소스
# graph.py 가 이 파일을 읽어 수집·선별·인사이트·발행에 쓴다. 코드를 고치지 않고 기준만 바꿀 수 있다.

newsletter:
  name: 비즈 브리핑
  purpose: >-
    경제 및 기업 뉴스를 자동으로 수집하고, 핵심 내용을 분석해
    기업의 기획·재무 의사결정에 도움이 되는 뉴스레터를 만든다.

audience:
  persona: 경제·경영에 관심 있는 취업준비생, 주니어 기획·재무 담당자
  roles: [사업기획, 경영기획, 재무기획(FP&A)]

# 인사이트가 답해야 할 핵심 질문 네 가지
questions:
  - 무슨 일이 일어났는가?
  - 왜 중요한가?
  - 기업의 매출·비용·수익성·전략에 어떤 영향을 미칠 수 있는가?
  - 앞으로 무엇을 주목해야 하는가?

# 중요도 판단 문장 — 선별 점수와 (나중에) LLM 선별 프롬프트가 모두 이 문장을 기준으로 삼는다
importance: >-
  이 뉴스가 기업의 매출·비용·수익성·자금조달·전략 판단을 바꿀 만한가.
  숫자(지표·실적)로 확인되는 변화일수록, 여러 기업에 동시에 영향을 줄수록 중요하다.

# 카테고리 4개 — 키워드가 걸리면 그 카테고리 점수가 오른다 (제목에서 걸리면 2점, 요약에서 1점)
categories:
  - name: 경제 지표
    question: 기업 환경이 어떻게 바뀔까?
    color: 0x2F6FB2
    keywords: [금리, 기준금리, 물가, 소비자물가, CPI, 인플레이션, 환율, 원·달러, 원달러, 달러, 소비, 소매판매,
               고용, 실업률, 성장률, GDP, 수출, 수입, 무역수지, 경상수지, 국채, 금통위, 연준, Fed, 경기]
  - name: 기업 실적
    question: 기업의 수익성은 왜 변했을까?
    color: 0x2E7D5B
    keywords: [실적, 매출, 영업이익, 순이익, 영업손실, 적자, 흑자, 현금흐름, 잠정실적, 분기, 어닝, 가이던스,
               컨센서스, 마진, 이익률, 전년 대비, 전분기]
  - name: 산업·경쟁
    question: 어떤 기업이 기회를 얻을까?
    color: 0x8F5606
    keywords: [반도체, HBM, 메모리, 파운드리, AI, 인공지능, 데이터센터, 유통, 이커머스, 플랫폼, 금융, 은행, 보험,
               증권, 배터리, 2차전지, 자동차, 전기차, 조선, 바이오, 점유율, 경쟁, 공급망, 관세]
  - name: 경영 의사결정
    question: 기업은 어떤 선택을 해야 할까?
    color: 0x6A4A9C
    keywords: [투자, 설비투자, 증설, 인수, 합병, M&A, 매각, 구조조정, 비용 절감, 감원, 희망퇴직, 신사업, 진출,
               자사주, 배당, 회사채, 유상증자, 차입, 자금조달, 지배구조, 분할]

# 숫자 신호 — 지표·실적처럼 숫자로 확인되는 기사에 가산점 (중요도 문장의 '숫자로 확인되는 변화')
signals:
  number_pattern: '\d[\d,.]*\s?(%|%p|bp|조|억|만\s?달러|달러|원)'
  number_bonus: 2

# 제외 조건
exclude:
  # 제목에 이 표현이 있으면 수집 단계에서 버린다 (발행 가치가 없는 형식)
  title_patterns: ['\[포토\]', '\[사진\]', '\[부고\]', '\[인사\]', '\[게시판\]', '\[오늘의', '\[표\]', '\[운세\]',
                   '날씨', '\[카드뉴스\]', '\[영상\]', '\[사설\]', '\[칼럼\]', '\[기고\]', '\[시론\]', '\[광고\]']
  # 이 표현이 있으면 감점 — 홍보성 소식은 의사결정 재료가 아니다
  penalty_patterns: ['MOU', '업무협약', '협약 체결', '수상', '기부', '봉사', '후원', '캠페인', '이벤트', '프로모션', '할인']
  penalty: 3

selection:
  batch: 40            # 예선 묶음 크기 — 한 번에 비교할 후보 수 (LLM 한 화면 기준, 18장 lost in the middle)
  prelim_per_batch: 8  # 묶음마다 본선에 올리는 수 — 최종 5건보다 넉넉히
  target: 5            # 최종 발행 건수 (과제 기준 3~5건)
  min_score: 3         # 이 점수 미만은 본선에 올라도 발행하지 않는다 — 조용한 날엔 3건 미만도 허용
  per_source: 2        # 본선에서 한 매체가 차지할 수 있는 최대 칸
  per_category: 2      # 본선에서 한 카테고리가 차지할 수 있는 최대 칸 — 네 카테고리를 고루

# 소스 — scripts/probe_sources.py 로 잰 숫자(store/source_probe.json)를 근거로 채택·탈락을 정했다
# 관문: G1 본문(최근 3건 중 2건 이상 600자↑) · G2 생존(24시간 안 글 5건↑) · G3 접근(HTTP 200)
#       + 무료판 조건: 피드 요약 80자↑ (무료판은 피드 요약을 발행 요약으로 쓴다)
sources:
  - {name: 한국은행,       url: 'https://www.bok.or.kr/portal/bbs/B0000501/news.rss?menuNo=201264', tier: 1, feed_as_body: true}
  - {name: 연합뉴스 경제,   url: 'https://www.yna.co.kr/rss/economy.xml',  tier: 2}
  - {name: 연합뉴스 산업,   url: 'https://www.yna.co.kr/rss/industry.xml', tier: 2}
  - {name: 매일경제 경제,   url: 'https://www.mk.co.kr/rss/30100041/',     tier: 2}
  - {name: 매일경제 기업,   url: 'https://www.mk.co.kr/rss/50100032/',     tier: 2}
  - {name: 머니투데이,      url: 'https://rss.mt.co.kr/mt_news.xml',       tier: 2}
  - {name: 아시아경제,      url: 'https://www.asiae.co.kr/rss/all.htm',    tier: 2}
  - {name: 뉴시스 경제,     url: 'https://newsis.com/RSS/economy.xml',     tier: 2}

rejected:
  - {name: 한국경제 경제·금융, reason: '피드 요약 0자 — 무료판에서 발행할 요약이 없음 (LLM 전환 시 재검토)'}
  - {name: 조선비즈,          reason: '피드 요약 0자 — 무료판에서 발행할 요약이 없음 (LLM 전환 시 재검토)'}
  - {name: 이데일리,          reason: 'G2 — 최신 글이 26시간 전, 24시간 안 0건'}
  - {name: CNBC Economy,     reason: '영어 기사 — 무료판은 번역 불가, 24시간 안 3건'}
  - {name: 한국경제 산업,      reason: 'G3 — HTTP 404'}
  - {name: 정책브리핑 기재부,   reason: 'G3 — HTTP 404'}
